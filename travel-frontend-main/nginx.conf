server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets and fallback to index.html for SPA routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: set long cache headers for static assets
    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|json)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Disable access logs for cleaner output (optional)
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
